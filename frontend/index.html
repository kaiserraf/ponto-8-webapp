<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Ponto 8</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../img/logo8.png">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--black);
      position: relative;
      overflow: hidden;
    }

    /* Decorative background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(245,197,24,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245,197,24,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Big decorative "8" in background */
    body::after {
      content: '8';
      position: fixed;
      right: -60px;
      bottom: -80px;
      font-family: var(--font-display);
      font-size: 500px;
      color: rgba(245,197,24,0.04);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-brand {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-brand__logo {
      font-family: var(--font-display);
      font-size: 52px;
      letter-spacing: 4px;
      color: var(--yellow);
      line-height: 1;
      display: block;
    }

    .login-brand__sub {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray-light);
      margin-top: 6px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow);
    }

    .login-card__title {
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--white);
      margin-bottom: 6px;
    }

    .login-card__sub {
      font-size: 13px;
      color: var(--gray-light);
      margin-bottom: 28px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .login-form .form-group {
      gap: 8px;
    }

    .login-form input {
      padding: 12px 14px;
      font-size: 15px;
    }

    .login-submit {
      width: 100%;
      justify-content: center;
      padding: 13px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 8px;
      border-radius: var(--radius);
      transition: all 0.2s ease;
    }

    .login-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-submit:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(245,197,24,0.3);
    }

    .login-error {
      background: rgba(224, 85, 85, 0.1);
      border: 1px solid rgba(224, 85, 85, 0.3);
      border-left: 3px solid #e05555;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      color: #e05555;
      display: none;
    }

    .login-error.visible { display: block; }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--gray-light);
    }

    .login-footer span {
      color: var(--yellow);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-brand">
      <span class="login-brand__logo">PONTO 8</span>
      <span class="login-brand__sub">Sistema de Gestão Automotiva</span>
    </div>

    <div class="login-card">
      <h1 class="login-card__title">ACESSO</h1>
      <p class="login-card__sub">Entre com suas credenciais para continuar.</p>

      <div class="login-error" id="login-error">
        E-mail ou senha incorretos. Tente novamente.
      </div>

      <form class="login-form" id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="seu@email.com"
            required
            autofocus
          />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="••••••••"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary login-submit" id="btn-submit">
          Entrar
        </button>
      </form>
    </div>

    <div class="login-footer">
      <span>PONTO 8 MOTORS</span> — Gestão Automotiva Inteligente
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.replace('/html/home.html');
    }

    const form      = document.getElementById('login-form');
    const btnSubmit = document.getElementById('btn-submit');
    const errorBox  = document.getElementById('login-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Aguarde...';

      try {
        const res = await fetch('http://localhost:3333/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.accessToken) {
          localStorage.setItem('token', data.accessToken);
          if (data.refreshToken) {
            localStorage.setItem('refreshToken', data.refreshToken);
          }
          window.location.href = '/html/home.html';
        } else {
          errorBox.classList.add('visible');
        }
      } catch (err) {
        errorBox.textContent = 'Erro de conexão. Verifique se o servidor está ativo.';
        errorBox.classList.add('visible');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Entrar';
      }
    });
  </script>

</body>
</html>
